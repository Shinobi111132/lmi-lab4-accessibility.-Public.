name: Import original accessibility lab and apply fixes

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-a11y.yml"

permissions:
  contents: write

jobs:
  import-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install HTML parsing dependency
        run: python -m pip install beautifulsoup4

      - name: Download the public source archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, urllib.request, zipfile
          url = "https://gitlab.com/kipz_tov/a11y-practical-task/-/archive/main/a11y-practical-task-main.zip"
          request = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (accessible-lab-import)"})
          with urllib.request.urlopen(request, timeout=90) as response:
              data = response.read()
          archive = pathlib.Path("/tmp/a11y-source.zip")
          archive.write_bytes(data)
          with zipfile.ZipFile(archive) as z:
              for item in z.namelist():
                  if item.startswith("/") or ".." in pathlib.PurePosixPath(item).parts:
                      raise RuntimeError("Unsafe source archive entry")
              z.extractall("/tmp/a11y-source")
          source = pathlib.Path("/tmp/a11y-source/a11y-practical-task-main")
          for filename in ("main.html","form.html","assets/css/site.css"):
              if not (source/filename).exists():
                  raise RuntimeError("Source file missing: "+filename)
          import shutil
          shutil.copytree(source, pathlib.Path("."), dirs_exist_ok=True, ignore=shutil.ignore_patterns(".git"))
          print("Original source restored from GitLab")
          PY

      - name: Apply accessible HTML changes
        run: |
          python - <<'PY'
          from pathlib import Path
          from base64 import b64decode
          from zlib import decompress
          source = Path("tools/restore_accessibility.py.zlib.b64")
          code = decompress(b64decode(source.read_text(encoding="utf-8").strip()))
          Path("/tmp/restore_a11y.py").write_bytes(code)
          PY
          python /tmp/restore_a11y.py

      - name: Commit the repaired source and all assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.html form.html assets README.md .gitignore
          if ! git diff --staged --quiet; then
            git commit -m "Import original ACME site and fix accessibility"
            git push
          else
            echo "No changes to commit"
          fi
